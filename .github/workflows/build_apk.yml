name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/spotify-playlist-import

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    name: Build FOSS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
        env:
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/foss/debug -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-foss-debug
          path: out/*.apk

      - name: Publish APK to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Latest APK build" \
              --notes "Debug APK built automatically from branch ${{ github.ref_name }}."
          fi
          gh release upload "$TAG" out/*.apk --clobber
